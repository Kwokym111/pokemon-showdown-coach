<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Panel</title>
  <!-- Strict CSP: only our own script file may run (no inline scripts). Extra safety in
       case something ever sneaks HTML into the panel. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; font-family: sans-serif; background: #1e1e24; color: #eee; padding: 10px; box-sizing: border-box; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    .stat { font-size: 13px; margin: 2px 0; }
    #log { flex: 1; margin-top: 8px; overflow-y: auto; background: #111; padding: 6px; font: 11px/1.4 Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Battle capture</h1>
  <div class="stat">Lines captured: <span id="count">0</span></div>
  <div class="stat">Room: <span id="room">(none yet)</span></div>
  <div id="log"></div>
  <script src="panel.js"></script>
</body>
</html>
