<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Review</title>
  <!-- Strict CSP: only our own script, stylesheet and font files (no inline scripts, onclick
       attributes or style attributes) and nothing loaded from the internet. Extra safety since
       this card shows names from the server. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'">
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="card" class="pending">
    <h1 id="title"><span>Game</span><span>Over</span></h1>
    <p id="message">Analyzing your game…</p>

    <div id="summary">
      <div id="versus">
        <div id="name-me" class="name name-left"></div>
        <div id="result-box">
          <div id="score">1 - 0</div>
          <div id="turns"></div>
        </div>
        <div id="name-opp" class="name name-right"></div>
      </div>

      <div id="graph-block">
        <p id="graph-title">Team HP left, turn by turn</p>
        <svg id="graph" viewBox="0 0 476 136" aria-label="Each team's HP left, turn by turn"></svg>
        <p id="graph-note">Opponent Pokémon you haven't seen yet count as full HP.</p>
      </div>

      <div id="tiles">
        <div class="tile"><span class="pill great">Great</span><span class="count" id="count-great">0</span></div>
        <div class="tile"><span class="pill good">Good</span><span class="count" id="count-good">0</span></div>
        <div class="tile"><span class="pill mistake">Mistake</span><span class="count" id="count-mistake">0</span></div>
        <div class="tile"><span class="pill blunder">Blunder</span><span class="count" id="count-blunder">0</span></div>
      </div>
      <p id="note"></p>
    </div>

    <div id="actions"><button id="close" type="button">Close</button></div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
